<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#475569"/></marker><marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#e11d48"/></marker></defs><rect width="1400" height="1100" fill="white"/><g font-family="Microsoft YaHei,SimHei,Arial,sans-serif"><text x="40" y="55" font-size="32" font-weight="700" fill="#0f172a">旧代码调用链与重复采样问题</text><text x="40" y="88" font-size="21" fill="#64748b">原版 Magic Tap 与 Speed 系列；红色标出旧逻辑的问题路径</text><rect x="40" y="110" width="620" height="100" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="64" y="148" font-size="25" font-weight="700" fill="#0f172a">MRTK 缓存关节位姿</text><text x="64" y="184" font-size="22" fill="#334155">接收新姿态的节奏独立于 FixedUpdate</text><rect x="40" y="260" width="620" height="115" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="64" y="298" font-size="25" font-weight="700" fill="#0f172a">AcceStudy3.FixedUpdate()</text><text x="64" y="334" font-size="22" fill="#334155">HandJointUtils.TryGetJointPose(IndexTip)</text><text x="64" y="366" font-size="22" fill="#334155">默认每 20 ms 轮询一次缓存位置</text><rect x="40" y="425" width="620" height="115" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="64" y="463" font-size="25" font-weight="700" fill="#0f172a">用固定步长计算运动</text><text x="64" y="499" font-size="22" fill="#334155">v = ||p₂ − p₁|| / fixedDeltaTime</text><text x="64" y="531" font-size="22" fill="#334155">a = (v − vprev) / fixedDeltaTime</text><path d="M350 210 V250" fill="none" stroke="#475569" stroke-width="3"  marker-end="url(#arrow)"/><path d="M350 375 V415" fill="none" stroke="#475569" stroke-width="3"  marker-end="url(#arrow)"/><rect x="740" y="110" width="620" height="175" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="764" y="148" font-size="25" font-weight="700" fill="#be123c">问题入口：没有核验手部更新身份</text><text x="764" y="184" font-size="22" fill="#9f1239">同一渲染帧可能执行多个 FixedUpdate</text><text x="764" y="216" font-size="22" fill="#9f1239">缓存尚未更新，也再次参与计算</text><text x="764" y="248" font-size="22" fill="#9f1239">内部固定步序号 ≠ MRTK 更新序号</text><path d="M740 205 H705 V315 H670" fill="none" stroke="#e11d48" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#redArrow)"/><rect x="740" y="405" width="620" height="135" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="764" y="443" font-size="25" font-weight="700" fill="#be123c">同一旧位置被再次用于差分</text><text x="764" y="479" font-size="22" fill="#9f1239">p₂ = p₁ → v = 0</text><text x="764" y="511" font-size="22" fill="#9f1239">若 vprev &gt; 0，则 a &lt; 0（突然减速）</text><path d="M740 470 H670" fill="none" stroke="#e11d48" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#redArrow)"/><path d="M350 540 V580 H350 V620" fill="none" stroke="#475569" stroke-width="3"  marker-end="url(#arrow)"/><path d="M350 580 H1050 V620" fill="none" stroke="#475569" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="630" width="620" height="155" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="64" y="668" font-size="25" font-weight="700" fill="#0f172a">8–11 Speed 系列</text><text x="64" y="704" font-size="22" fill="#334155">InEvent → S2AccMode 回调</text><text x="64" y="736" font-size="22" fill="#334155">CheckSpeedReleaseIndexTrigger()</text><text x="64" y="768" font-size="22" fill="#334155">v ≤ Speed Min Threshold → armed</text><rect x="740" y="630" width="620" height="155" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="764" y="668" font-size="25" font-weight="700" fill="#0f172a">原版 Magic Tap</text><text x="764" y="704" font-size="22" fill="#334155">Acce = true → JudgeAcce()</text><text x="764" y="736" font-size="22" fill="#334155">满足低速 A 或减速 B 条件</text><text x="764" y="768" font-size="22" fill="#334155">→ Prepared</text><path d="M350 785 V810" fill="none" stroke="#475569" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1050 785 V810" fill="none" stroke="#475569" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="820" width="620" height="110" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="64" y="858" font-size="25" font-weight="700" fill="#0f172a">后续高速达到门限时确认</text><text x="64" y="894" font-size="22" fill="#334155">11号还要求方向就绪且在取消方向外</text><rect x="740" y="820" width="620" height="110" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="764" y="858" font-size="25" font-weight="700" fill="#0f172a">通过后续确认时间与取消检查</text><text x="764" y="894" font-size="22" fill="#334155">HesEvent → SetHesMode → CompleteSelection</text><rect x="40" y="980" width="1320" height="90" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="65" y="1018" font-size="25" font-weight="700" fill="#be123c">风险：准备状态可能由重复读取产生的零速 / 减速建立</text><text x="65" y="1050" font-size="22" fill="#9f1239">这种记录不能直接作为新的物理停手证据；进入准备也不等于必然触发。</text></g></svg>