<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><rect width="1400" height="1100" fill="white"/><g font-family="Microsoft YaHei,SimHei,Arial,sans-serif"><text x="38" y="42" font-size="31" fill="#0f172a" font-weight="700">从传感器到 FixedUpdate：旧调用逻辑与重复读取问题</text><text x="38" y="76" font-size="19" fill="#64748b" font-weight="400">Quest Pro + Unity Editor + Quest Link；箭头表示数据传递，不表示同一帧执行。频率为本次软件观察值。</text><rect x="38" y="103" width="626" height="84" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.8"/><text x="57" y="133" font-size="22" fill="#5b21b6" font-weight="700">① 头显追踪摄像头 / 传感器</text><text x="57" y="162" font-size="18" fill="#334155" font-weight="400">真实手指运动 → 图像输入；原始相机帧与硬件采样率未采集。</text><path d="M351 187 V208" fill="none" stroke="#64748b" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="38" y="215" width="626" height="105" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.8"/><text x="57" y="245" font-size="22" fill="#5b21b6" font-weight="700">② Meta 手追踪运行时 + Quest Link → PC XR 运行时</text><text x="57" y="274" font-size="18" fill="#334155" font-weight="400">图像 → 手部关节估计 / 跟踪；经 Link 向电脑提供姿态。</text><text x="57" y="300" font-size="18" fill="#334155" font-weight="400">运行时输出预测姿态；内部推理、Link 传输与缓存节奏未测。</text><path d="M351 320 V339" fill="none" stroke="#64748b" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="38" y="346" width="626" height="119" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8"/><text x="57" y="376" font-size="22" fill="#1d4ed8" font-weight="700">③ Oculus SDK：OVRHand.Update() 读取姿态</text><text x="57" y="405" font-size="18" fill="#334155" font-weight="400">OVRPlugin.GetHandState(Render) → _handState 缓存。</text><text x="57" y="431" font-size="18" fill="#334155" font-weight="400">本次右手读取约 71.02 Hz；读取成功不等于相机生成新帧。</text><text x="57" y="457" font-size="18" fill="#334155" font-weight="400">本次 OpenXR 后端：OVRHand.FixedUpdate 不读 Physics。</text><path d="M351 465 V485" fill="none" stroke="#64748b" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="38" y="492" width="626" height="98" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8"/><text x="57" y="522" font-size="22" fill="#1d4ed8" font-weight="700">④ OVRSkeleton：SDK 状态 → 骨架 Transform / Bones</text><text x="57" y="551" font-size="18" fill="#334155" font-weight="400">Update / FixedUpdate 应用已有状态；不额外采集传感器。</text><text x="57" y="577" font-size="18" fill="#334155" font-weight="400">即使骨架在固定步更新，MRTK 关节字典也不会自动刷新。</text><path d="M351 590 V610" fill="none" stroke="#64748b" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="38" y="617" width="626" height="144" rx="12" fill="#ecfeff" stroke="#22b8cf" stroke-width="1.8"/><text x="57" y="647" font-size="22" fill="#0e7490" font-weight="700">⑤ MRTK 输入 Provider → 关节缓存 / 事件</text><text x="57" y="676" font-size="17.5" fill="#334155" font-weight="400">OculusXRSDKDeviceManager.Update → OculusHand.UpdateController</text><text x="57" y="702" font-size="17.5" fill="#334155" font-weight="400">→ UpdateHandData：读取 Bones → jointPoses 关节字典</text><text x="57" y="728" font-size="17.5" fill="#334155" font-weight="400">→ RaiseHandJointsUpdated 发布事件；每个来源约 71.02 Hz。</text><text x="57" y="754" font-size="17.5" fill="#334155" font-weight="400">当前同一 Provider 注册两次：同一右手状态产生两个 SourceId。</text><rect x="716" y="103" width="646" height="129" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/><text x="735" y="133" font-size="22" fill="#334155" font-weight="700">Unity 调度：应用帧与固定步是两种时间尺度</text><text x="735" y="162" font-size="18" fill="#334155" font-weight="400">Update：每个 Unity 应用帧一次；本次约 71.02 FPS。</text><text x="735" y="188" font-size="18" fill="#334155" font-weight="400">FixedUpdate：按逻辑步长 20 ms 推进，目标约 50 Hz。</text><text x="735" y="214" font-size="18" fill="#334155" font-weight="400">一帧可执行 0 次、1 次或多次固定步；“补跑”可连续读旧缓存。</text><rect x="716" y="255" width="646" height="129" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/><text x="735" y="285" font-size="22" fill="#334155" font-weight="700">顺序：MRTK -100 → OVRHand -90 → OVRSkeleton -80</text><text x="735" y="314" font-size="18" fill="#334155" font-weight="400">当前 MRTK.Update 可能使用前一应用帧应用的骨架。</text><text x="735" y="340" font-size="18" fill="#334155" font-weight="400">本次候选关联：SDK 帧 N → MRTK 帧 N+1 → FixedUpdate 帧 N+2。</text><text x="735" y="366" font-size="18" fill="#334155" font-weight="400">以上帧均为 Unity 应用帧；骨架位置匹配不等于硬件帧 ID。</text><rect x="716" y="407" width="646" height="153" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/><text x="735" y="437" font-size="22" fill="#334155" font-weight="700">把三种现象分开，避免误称“硬件重复采样”</text><text x="735" y="466" font-size="18" fill="#334155" font-weight="400">硬件帧是否重复：没有原始硬件帧 ID，当前无法判断。</text><text x="735" y="492" font-size="18" fill="#334155" font-weight="400">Provider 双来源发布：同一 SDK 状态 → 两个 MRTK 来源。</text><text x="735" y="518" font-size="18" fill="#334155" font-weight="400">FixedUpdate 重复消费读取：同一来源的同一序号再被读取。</text><text x="735" y="544" font-size="18" fill="#334155" font-weight="400">两个 Oculus Provider ≠ 两个 MRTK 主系统 ≠ 左右手各一个。</text><rect x="716" y="583" width="646" height="178" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.8"/><text x="735" y="613" font-size="22" fill="#047857" font-weight="700">本次正式测试：28.56 秒，动态阈值 ixdlDynamic</text><text x="735" y="642" font-size="18" fill="#334155" font-weight="400">FixedUpdate 消费读取 1,429 次，实际约 50.01 Hz。</text><text x="735" y="668" font-size="18" fill="#334155" font-weight="400">同帧同序号重复 39 次（2.73%），当前代码全部跳过。</text><text x="735" y="694" font-size="18" fill="#334155" font-weight="400">补跑两次读取实际相隔中位数 0.422 ms，逻辑时间仍增 20 ms。</text><text x="735" y="720" font-size="18" fill="#334155" font-weight="400">SDK 返回 → FixedUpdate 消费读取：中位数约 27.36 ms。</text><text x="735" y="746" font-size="18" fill="#334155" font-weight="400">时间差基于候选软件链路，不包含相机采集到 SDK 的延迟。</text><path d="M351 761 V781 H348 V801" fill="none" stroke="#64748b" stroke-width="2.7"  marker-end="url(#arrow)"/><path d="M351 781 H1038 V801" fill="none" stroke="#64748b" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="38" y="810" width="626" height="222" rx="12" fill="#fff1f2" stroke="#fb7185" stroke-width="1.8"/><text x="57" y="840" font-size="22" fill="#be123c" font-weight="700">旧分支：AcceStudy3.FixedUpdate() 消费读取</text><text x="57" y="869" font-size="17.5" fill="#334155" font-weight="400">HandJointUtils.TryGetJointPose(IndexTip) → MRTK 缓存</text><text x="57" y="895" font-size="17.5" fill="#334155" font-weight="400">不核验 MRTK 更新序号：v = |Δp| / 0.02；a = (v − v前) / 0.02</text><text x="57" y="921" font-size="17.5" fill="#334155" font-weight="400">重复位置 → v = 0；前次速度非零时，还会得到 a &lt; 0。</text><text x="57" y="947" font-size="17.5" fill="#334155" font-weight="400">Speed：InEvent → S2AccMode 检查低速 → armed。</text><text x="57" y="973" font-size="17.5" fill="#334155" font-weight="400">原版 Magic Tap：JudgeAcce() → Prepared。</text><text x="57" y="999" font-size="17.5" fill="#334155" font-weight="400">后续达到确认条件才触发；准备状态不等于必然选择。</text><rect x="716" y="810" width="646" height="222" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.8"/><text x="735" y="840" font-size="22" fill="#047857" font-weight="700">当前分支：共同预处理 + FixedUpdate 消费读取</text><text x="735" y="869" font-size="17.5" fill="#334155" font-weight="400">事件 → Study3HandPoseSource 保存来源、Sequence 与接收时间</text><text x="735" y="895" font-size="17.5" fill="#334155" font-weight="400">S2AccMode.FixedUpdate → UpdateSharedMotionSelection()</text><text x="735" y="921" font-size="17.5" fill="#334155" font-weight="400">TryGetSample → Study3MotionTracker.TrySample</text><text x="735" y="947" font-size="17.5" fill="#334155" font-weight="400">同来源、同追踪期且序号未变：不推进运动历史，不触发选择。</text><text x="735" y="973" font-size="17.5" fill="#334155" font-weight="400">新样本：按实际 MRTK 接收时间差计算速度与加速度。</text><text x="735" y="999" font-size="17.5" fill="#334155" font-weight="400">Magic Tap 2.0 / IxDL Dynamic 共用；其他机制尚未全部统一。</text><text x="38" y="1067" font-size="20" fill="#334155" font-weight="700">旧路径风险：缓存重复可建立低速 / 减速准备。当前 39 条已跳过；仍需分别处理 Provider 配置与数据更新时机。</text></g></svg>