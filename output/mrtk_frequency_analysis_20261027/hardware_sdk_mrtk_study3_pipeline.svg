<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1850" viewBox="0 0 1800 1850">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#64748b"/></marker><marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#e11d48"/></marker></defs>
<rect width="1800" height="1850" fill="#fff"/><g font-family="Microsoft YaHei,SimHei,Arial,sans-serif"><text x="60" y="58" font-size="39" fill="#0f172a" font-weight="700">指尖数据怎样到达选择算法：硬件 → Oculus SDK → MRTK → Study3</text><text x="60" y="102" font-size="24" fill="#475569" font-weight="400">当前项目代码路径；F = 实际应用帧率，P = 实际 FixedUpdate 回调率（稳定、timeScale=1 时约 50 Hz）</text><text x="60" y="137" font-size="23" fill="#64748b" font-weight="400">区间按稳定运行时每只手、每条路径统计；0 表示停更或无有效数据。调用、缓存发布、独立物理新采样分别计数。</text><rect x="60" y="180" width="850" height="130" rx="16" fill="#f4f0ff" stroke="#a78bfa" stroke-width="2"/><text x="84" y="222" font-size="29" fill="#5b21b6" font-weight="700">① 头显摄像头｜真实手指 → 图像</text><text x="84" y="262" font-size="24" fill="#334155" font-weight="400">图像是系统手追踪的输入，应用当前没有直接读取原始摄像头帧。</text><text x="84" y="298" font-size="24" fill="#334155" font-weight="400">有效输入下限：0 Hz；本设备 / 当前模式的摄像头上限：未核实。</text><path d="M485 310 V342" fill="none" stroke="#64748b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="60" y="350" width="850" height="165" rx="16" fill="#f4f0ff" stroke="#a78bfa" stroke-width="2"/><text x="84" y="392" font-size="29" fill="#5b21b6" font-weight="700">② Meta 系统 Runtime｜图像 → 估计的手部关节姿态</text><text x="84" y="432" font-size="24" fill="#334155" font-weight="400">本项目请求 LOW 档；实际有效新姿态率：下限 0，上限待实测。</text><text x="84" y="468" font-size="24" fill="#334155" font-weight="400">官方 HIGH 档目标约 60 Hz，仅作能力参考，非当前实测上限。</text><text x="84" y="504" font-size="24" fill="#334155" font-weight="400">跟踪算法输出、预测姿态与原始摄像头帧并非一一对应。</text><path d="M485 515 V547" fill="none" stroke="#64748b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="60" y="555" width="850" height="200" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="84" y="597" font-size="29" fill="#1d4ed8" font-weight="700">③ Oculus SDK｜OVRPlugin.GetHandState → OVRHand</text><text x="84" y="637" font-size="24" fill="#334155" font-weight="400">Render：每个 Update 读取一次；成功读取数 0～F 次/秒。</text><text x="84" y="673" font-size="24" fill="#334155" font-weight="400">Physics：仅非 OpenXR 后端每个固定步读取；0～P 次/秒。</text><text x="84" y="709" font-size="24" fill="#334155" font-weight="400">合计上限：OpenXR 为 F；非 OpenXR 为 F + P。</text><text x="84" y="745" font-size="24" fill="#334155" font-weight="400">读取保存到 _handState；再次成功读取不保证新的物理采样。</text><path d="M485 755 V787" fill="none" stroke="#64748b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="60" y="795" width="850" height="130" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="84" y="837" font-size="29" fill="#1d4ed8" font-weight="700">④ Oculus SDK｜OVRSkeleton 应用骨架 Transform</text><text x="84" y="877" font-size="24" fill="#334155" font-weight="400">Update + FixedUpdate 使用 OVRHand 已保存的数据应用骨架。</text><text x="84" y="913" font-size="24" fill="#334155" font-weight="400">成功应用次数：0～(F + P) 次/秒；这一步不会额外采集摄像头帧。</text><path d="M485 925 V957" fill="none" stroke="#64748b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="60" y="965" width="850" height="165" rx="16" fill="#ecfeff" stroke="#22b8cf" stroke-width="2"/><text x="84" y="1007" font-size="29" fill="#0e7490" font-weight="700">⑤ MRTK｜OculusHand.jointPoses 关节缓存</text><text x="84" y="1047" font-size="23" fill="#334155" font-weight="400">DeviceManager.Update → UpdateHandData（按应用帧更新）。</text><text x="84" y="1083" font-size="23" fill="#334155" font-weight="400">复制骨架关节位置，再发布 HandJointsUpdated 事件。</text><text x="84" y="1119" font-size="23" fill="#334155" font-weight="400">每只手更新次数：0～F 次/秒；Physics 读取不会自动刷新此字典。</text><rect x="970" y="180" width="770" height="240" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="994" y="222" font-size="29" fill="#334155" font-weight="700">Unity 引擎：安排调用时机，不产生硬件采样</text><text x="994" y="262" font-size="24" fill="#334155" font-weight="400">Update：每个应用帧一次；实际频率记作 F。</text><text x="994" y="298" font-size="24" fill="#334155" font-weight="400">FixedUpdate：按固定步累计补跑；实际频率记作 P。</text><text x="994" y="334" font-size="24" fill="#334155" font-weight="400">当前请求 50 Hz，每个模拟步长为 20 ms。</text><text x="994" y="370" font-size="24" fill="#334155" font-weight="400">暂停 / 卡顿时可能停更，也可能同帧补跑多个固定步。</text><text x="994" y="406" font-size="24" fill="#334155" font-weight="400">50 Hz 是模拟目标，不是瞬时调用频率的硬上限。</text><rect x="970" y="455" width="770" height="275" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="994" y="497" font-size="29" fill="#334155" font-weight="700">数字示例｜假设 F = 70、P = 50 次/秒</text><text x="994" y="537" font-size="24" fill="#334155" font-weight="400">Oculus SDK 成功读取：OpenXR 0～70 次/秒；</text><text x="994" y="573" font-size="24" fill="#334155" font-weight="400">非 OpenXR 0～120 次/秒。</text><text x="994" y="609" font-size="24" fill="#334155" font-weight="400">骨架应用：0～120 次/秒；MRTK 发布：0～70 次/秒。</text><text x="994" y="645" font-size="24" fill="#334155" font-weight="400">旧运动计算：0～50 次/秒，其中可能反复用同一缓存。</text><text x="994" y="681" font-size="24" fill="#334155" font-weight="400">共享管线接受新样本：0～50 次/秒，受两端频率约束。</text><text x="994" y="717" font-size="24" fill="#334155" font-weight="400">以上都是软件次数，不代表摄像头或物理新采样数。</text><rect x="970" y="765" width="770" height="200" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="994" y="807" font-size="29" fill="#334155" font-weight="700">已知设置与实测范围</text><text x="994" y="847" font-size="23" fill="#334155" font-weight="400">Pilot 三个会话平均应用帧率：69.84～70.01 FPS。</text><text x="994" y="883" font-size="23" fill="#334155" font-weight="400">这是会话均值范围，不是瞬时帧率的上下限。</text><text x="994" y="919" font-size="23" fill="#334155" font-weight="400">samplingRateHz 代码下限 1 Hz，无显式最大值；</text><text x="994" y="955" font-size="23" fill="#334155" font-weight="400">实际执行仍受 Unity、设备性能与 timeScale 限制。</text><rect x="970" y="1000" width="770" height="165" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="994" y="1042" font-size="29" fill="#334155" font-weight="700">同一 Update 阶段的静态执行顺序</text><text x="994" y="1082" font-size="24" fill="#334155" font-weight="400">MRTK(-100) → OVRHand(-90) → OVRSkeleton(-80)</text><text x="994" y="1118" font-size="24" fill="#334155" font-weight="400">MRTK 可能先读取本帧 Render 刷新前的骨架。</text><text x="994" y="1154" font-size="24" fill="#334155" font-weight="400">Physics 分支可能提前刷新；额外延迟需实机核验。</text><path d="M485 1130 V1180 H330 V1192" fill="none" stroke="#64748b" stroke-width="3"  marker-end="url(#arrow)"/><path d="M485 1180 H900 V1192" fill="none" stroke="#64748b" stroke-width="3"  marker-end="url(#arrow)"/><path d="M900 1180 H1470 V1192" fill="none" stroke="#64748b" stroke-width="3"  marker-end="url(#arrow)"/><rect x="60" y="1200" width="540" height="245" rx="16" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/><text x="84" y="1242" font-size="29" fill="#be123c" font-weight="700">⑥A 旧运动计算：AcceStudy3</text><text x="84" y="1282" font-size="23" fill="#334155" font-weight="400">TryGetJointPose(IndexTip) → 读缓存。</text><text x="84" y="1318" font-size="23" fill="#334155" font-weight="400">有效计算次数：0～P，稳定时约 50 Hz。</text><text x="84" y="1354" font-size="23" fill="#334155" font-weight="400">v = 位移 / 20 ms；a = 速度差 / 20 ms。</text><text x="84" y="1390" font-size="23" fill="#334155" font-weight="400">同一缓存可被当作新位置再次参与计算。</text><text x="84" y="1426" font-size="23" fill="#334155" font-weight="400">用于原版 Magic Tap、Speed 等。</text><rect x="630" y="1200" width="540" height="245" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="654" y="1242" font-size="29" fill="#047857" font-weight="700">⑥B Magic Tap 2.0 / IxDL 共享运动</text><text x="654" y="1282" font-size="23" fill="#334155" font-weight="400">MRTK 事件 → SourceId / Sequence / 接收时间。</text><text x="654" y="1318" font-size="23" fill="#334155" font-weight="400">FixedUpdate 读取；重复序号跳过运动计算。</text><text x="654" y="1354" font-size="23" fill="#334155" font-weight="400">稳态接受率：0～min(F, P) 次/秒。</text><text x="654" y="1390" font-size="23" fill="#334155" font-weight="400">速度使用被接受样本的接收时间差。</text><text x="654" y="1426" font-size="23" fill="#334155" font-weight="400">仍不等于已按硬件物理帧去重。</text><rect x="1200" y="1200" width="540" height="245" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="1224" y="1242" font-size="29" fill="#047857" font-weight="700">⑥C Update 路径：DynamicStop 等</text><text x="1224" y="1282" font-size="23" fill="#334155" font-weight="400">主循环每帧执行；单条轮询路径 0～F。</text><text x="1224" y="1318" font-size="23" fill="#334155" font-weight="400">TryGetJointPose 返回 MRTK 已知的指尖。</text><text x="1224" y="1354" font-size="23" fill="#334155" font-weight="400">DynamicStop、Fast Tap、Pinch 有此类路径。</text><text x="1224" y="1390" font-size="23" fill="#334155" font-weight="400">同帧可读多关节、多目标；总查询可高于 F。</text><text x="1224" y="1426" font-size="23" fill="#334155" font-weight="400">各路径并未统一做新采样身份判定。</text><rect x="60" y="1490" width="1680" height="205" rx="16" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/><text x="84" y="1532" font-size="29" fill="#be123c" font-weight="700">旧问题发生在 MRTK 缓存 → 旧运动计算之间</text><rect x="90" y="1558" width="450" height="90" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="114" y="1600" font-size="29" fill="#334155" font-weight="700">Fixed 第一次：读取位置 A</text><rect x="665" y="1558" width="450" height="90" rx="16" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/><text x="689" y="1600" font-size="29" fill="#be123c" font-weight="700">Fixed 第二次：仍读 A，v = 0</text><rect x="1240" y="1558" width="470" height="90" rx="16" fill="#ecfeff" stroke="#22b8cf" stroke-width="2"/><text x="1264" y="1600" font-size="29" fill="#0e7490" font-weight="700">随后 MRTK.Update 刷新缓存</text><path d="M540 1603 H657" fill="none" stroke="#e11d48" stroke-width="3"  marker-end="url(#redArrow)"/><path d="M1115 1603 H1232" fill="none" stroke="#e11d48" stroke-width="3"  marker-end="url(#redArrow)"/><text x="90" y="1680" font-size="24" fill="#9f1239" font-weight="400">即使 Physics 已更新 SDK / 骨架，旧主程序通过 MRTK 读取时仍可能拿到同一份缓存。调用成功 ≠ 收到新采样。</text><text x="60" y="1745" font-size="22" fill="#475569" font-weight="400">边界说明：0 是有效数据率的全局下限；无法给出实机保证的非零下限。F/P 随运行变化，节点中的上限是代码调用边界。</text><text x="60" y="1780" font-size="22" fill="#475569" font-weight="400">HIGH 的 60 Hz 是官方目标参考，部分地区 / 运行条件可能约 50 Hz；当前旧 SDK + LOW 档不能直接套用这一数值。</text><text x="60" y="1815" font-size="21" fill="#64748b" font-weight="400">依据：本地 SDK / MRTK / Study3 源码；Pilot 三段 Speed 日志；Meta Hand Tracking / Fast Motion Mode 官方文档。2026-10-27</text></g></svg>